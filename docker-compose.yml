services:
  postgres:
    image: postgres:17-alpine
    container_name: omnes-postgres
    environment:
      POSTGRES_USER: omnes
      POSTGRES_PASSWORD: omnes
      POSTGRES_DB: omnes_inventory
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnes']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: omnes-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
